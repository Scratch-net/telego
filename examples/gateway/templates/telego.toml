[general]
bind-to = "0.0.0.0:9443"

[secrets]
gateway = "__SECRET__"

[tls-fronting]
mask-host = "__DOMAIN__"
cert-host = "127.0.0.1"
cert-port = 8444
splice-host = "127.0.0.1"
splice-port = 8443
splice-proxy-protocol = 2

[web-proxy]
enabled = true
hostname = "__DOMAIN__"
carrier = "__CARRIER__"
bind-to = "127.0.0.1:8080"
# Telego derives the local MTProxy backend from [general].bind-to.
trusted-proxy-cidrs = ["127.0.0.1/32"]
