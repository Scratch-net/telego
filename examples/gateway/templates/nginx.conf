user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Do not log query arguments or WebSocket subprotocol credentials.
    log_format telego_safe '$remote_addr - [$time_local] '
                           '"$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent '
                           'upgrade="$http_upgrade" connection="$http_connection"';
    access_log /var/log/nginx/access.log telego_safe;

    map $http_upgrade $telego_connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream telego_web {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    upstream public_site {
        server 127.0.0.1:8090;
        keepalive 16;
    }

    server {
        listen 80;
        server_name __DOMAIN__;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8090;
        server_name __DOMAIN__;
        client_max_body_size 16m;
        root /var/www/html;

        location = /healthz {
            access_log off;
            return 204;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        include /etc/nginx/telego-gateway/server.conf;
    }

    server {
        listen 8443 ssl proxy_protocol default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        include /etc/nginx/telego-gateway/server.conf;
    }

    server {
        listen 8444 ssl default_server;
        server_name __DOMAIN__;

        ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            return 204;
        }
    }
}
