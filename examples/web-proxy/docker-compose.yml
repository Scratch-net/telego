services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    expose:
      - "8443"
      - "8444"
      - "8090"
    networks:
      telego-private:
        ipv4_address: 172.28.0.2
        aliases:
          - proxy.example.com
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/var/www/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  telego:
    image: scratchnet/telego:latest
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "443:443"
    expose:
      - "8080"
    networks:
      telego-private:
        ipv4_address: 172.28.0.3
    volumes:
      - ./telego.toml:/config.toml:ro
    command: ["run", "-c", "/config.toml", "-l"]

  certbot:
    image: certbot/certbot
    profiles: ["ops"]
    networks:
      - telego-private
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/lib:/var/lib/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["certbot"]
    command: ["--version"]

networks:
  telego-private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
