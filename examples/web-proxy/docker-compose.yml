services:
  nginx:
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    expose:
      - "8443"
      - "8444"
      - "8090"
    networks:
      telego-private:
        ipv4_address: 172.28.0.2
        aliases:
          - proxy.example.com
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/var/www/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  telego:
    image: scratchnet/telego:latest
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "443:443"
    expose:
      - "8080"
    networks:
      telego-private:
        ipv4_address: 172.28.0.3
    volumes:
      - ./telego.toml:/config.toml:ro
    command: ["run", "-c", "/config.toml", "-l"]

  certbot:
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    profiles: ["ops"]
    networks:
      - telego-private
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/lib:/var/lib/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["certbot"]
    command: ["--version"]

networks:
  telego-private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
