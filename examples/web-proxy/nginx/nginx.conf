user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream telego_web {
        server 172.28.0.3:8080;
        keepalive 64;
    }

    upstream public_site {
        server 127.0.0.1:8090;
        keepalive 16;
    }

    server {
        listen 80;
        server_name proxy.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8090;
        server_name proxy.example.com;
        client_max_body_size 16m;
        root /var/www/html;

        location = /healthz {
            return 204;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Reject unknown SNI before the request can reach a WEB fallback.
    server {
        listen 8443 ssl proxy_protocol default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl proxy_protocol;
        http2 on;
        server_name proxy.example.com;
        client_max_body_size 16m;

        ssl_certificate /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        set_real_ip_from 172.28.0.3;
        real_ip_header proxy_protocol;

        # Send every TLS request through Telego. Telego returns 418 for an
        # ordinary site request and 419 for an unauthenticated carrier request.
        location / {
            proxy_pass http://telego_web;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
            proxy_intercept_errors on;
            recursive_error_pages off;
            error_page 418 = @telego_ordinary;
            error_page 419 = @telego_sanitized;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
        }

        location @telego_ordinary {
            internal;
            proxy_pass http://public_site;
            proxy_http_version 1.1;
            proxy_pass_request_body on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header Forwarded $http_forwarded;
            proxy_set_header Connection $http_connection;
            proxy_set_header Upgrade $http_upgrade;
        }

        location @telego_sanitized {
            internal;
            proxy_pass http://public_site$uri;
            proxy_http_version 1.1;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Host $http_host;
            proxy_set_header Content-Length "";
            proxy_set_header Content-Type "";
            proxy_set_header Transfer-Encoding "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Up-Seq "";
            proxy_set_header X-Down-Cursor "";
            proxy_set_header X-Session-Token "";
            proxy_set_header X-Carrier-Mode "";
            proxy_set_header X-Up-Ack "";
            proxy_set_header X-Lane-ID "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
        }
    }

    server {
        listen 8444 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 8444 ssl;
        server_name proxy.example.com;

        ssl_certificate /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /healthz {
            return 204;
        }

        location / {
            return 404;
        }
    }
}
