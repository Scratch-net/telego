[general]
bind-to = "0.0.0.0:443"

[secrets]
alice = "0123456789abcdef0123456789abcdef"

[tls-fronting]
mask-host = "proxy.example.com"
cert-host = "proxy.example.com"
cert-port = 8444
splice-host = "nginx"
splice-port = 8443
splice-proxy-protocol = 2

[web-proxy]
enabled = true
hostname = "proxy.example.com"
# Accepted values: https, https-lanes, websocket, websocket-lanes.
# For maximum WEB performance, use websocket-lanes with Nginx upgrade forwarding.
# An empty or absent value selects https.
carrier = "websocket-lanes"
bind-to = "0.0.0.0:8080"
# Without backend, WEB streams enter the shared MTProxy core directly on gnet.
trusted-proxy-cidrs = ["172.28.0.2/32"]
